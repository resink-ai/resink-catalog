[project]
name = "resink-catalog"
version = "0.0.3"
description = "Local Catalog: turn data files on your computer into queryable Iceberg tables."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["iceberg", "catalog", "csv", "parquet", "mcp", "duckdb", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "duckdb>=1.5.6",
  "fastapi>=0.115",
  "mcp>=2.3.0",
  "pandas>=2.3.3",
  "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
  "uvicorn>=0.30",
  # OS credential store for the push client's tokens (MIT); Linux uses a 0600 file instead
  "keyring>=25; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/resink-ai/resink-catalog"
Source = "https://github.com/resink-ai/resink-catalog"
Issues = "https://github.com/resink-ai/resink-catalog/issues"

[project.scripts]
resink-catalog = "resink_catalog.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "openapi-spec-validator>=0.9.0",
  "pyyaml>=6.0.3",
  "packaging>=24",
  "tomli>=2; python_version < '3.11'",  # scripts/licenses.py reads uv.lock
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resink_catalog"]
# the web UI build is git-ignored but must ship in the wheel
artifacts = ["src/resink_catalog/static/**"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/test-results"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
