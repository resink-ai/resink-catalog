name: Release

# Push a tag like v0.1.0 to publish. PyPI uses trusted publishing (no token in the repository): configure the
# project's trusted publisher on pypi.org for this workflow and the `pypi` environment first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RESINK_CATALOG_REQUIRE_DUCKDB_EXTENSIONS: "1"  # a skipped DuckDB test would let a release through unchecked
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run python scripts/install_duckdb_extensions.py
      - run: uv run ruff check .
      - run: sh scripts/build_ui.sh
      - name: Tests (no skips allowed for the DuckDB tests)
        run: uv run pytest -ra
      - name: The tag matches the package version
        shell: bash
        run: test "v$(uv run python -c 'import resink_catalog; print(resink_catalog.__version__)')" = "${GITHUB_REF_NAME}"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/build_ui.sh
      - run: sh scripts/check_wheel.sh && uv build  # check_wheel starts from a clean dist/; the second build adds the sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
